<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <link rel="shortcut icon" href="assets/images/logo-1.png" type="image/x-icon">
  <meta name="description" content="ampersand code — a VS Code-style editor in your browser, with syntax highlighting, autocomplete and a per-file language picker.">
  <title>ampersand code</title>
  <link rel="stylesheet" href="assets/ide/ide.css">
</head>
<body>
  <div class="ide">
    <div class="ide-titlebar">
      <a class="brand" href="home.html">ampersand<span class="dot">&nbsp;code</span></a>
      <span class="title-center">ampersand code — web editor</span>
      <div class="actions">
        <button id="downloadBtn" class="btn secondary"></button>
        <button id="runBtn" class="btn"></button>
      </div>
    </div>

    <div class="ide-body">
      <div class="activity-bar">
        <button class="activity-btn active" title="Explorer">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>
        </button>
        <button class="activity-btn" title="Settings (coming soon)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"></path></svg>
        </button>
      </div>

      <div class="sidebar" id="sidebar">
        <div class="sidebar-section-header">
          <span>Explorer</span>
          <span class="header-actions">
            <button id="newFileBtnSidebar" class="icon-btn" title="New File"></button>
          </span>
        </div>
        <div class="explorer-list" id="explorerList"></div>

        <div class="outline-section">
          <div class="sidebar-section-header"><span>Outline</span></div>
          <div class="outline-list" id="outlineList"></div>
        </div>
      </div>

      <div class="editor-area">
        <div class="tab-bar" id="tabBar"></div>
        <div class="editor-host">
          <div id="monaco-container"></div>
          <div class="editor-empty-state" id="editorEmptyState" style="display:none;">
            <div class="big-plus">No file open</div>
            <button id="newFileBtnEmpty">New File</button>
          </div>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-left">
        <span class="status-item no-hover" id="statusBranch">⎇ web-only</span>
      </div>
      <div class="status-right">
        <span class="status-item" id="statusPos"></span>
        <span class="status-item" id="statusLang" title="Click to change language"></span>
        <span class="status-item no-hover">UTF-8</span>
      </div>
    </div>
  </div>

  <!-- New File modal -->
  <div class="modal-overlay" id="newFileModal" hidden>
    <div class="modal">
      <div class="modal-header">New File</div>
      <div class="modal-body">
        <div class="modal-field">
          <label for="newFileName">File name</label>
          <input type="text" id="newFileName" autocomplete="off" spellcheck="false">
          <div class="hint">The extension picks the language automatically — or just pick one below.</div>
        </div>
        <div class="modal-field">
          <label>Language</label>
          <div class="lang-grid" id="langGrid"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn secondary" id="modalCancel">Cancel</button>
        <button class="btn" id="modalCreate">Create File</button>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
  <script src="assets/ide/ide.js"></script>
  <script>
    require.config({ paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs" } });
    require(["vs/editor/editor.main"], function () {
      window.AmpersandIDE.boot(window.monaco);
    });
  </script>
</body>
</html>
